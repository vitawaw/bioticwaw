# BIOTICWAW 1.5.0: run the tests on every push and pull request (no secrets, no deploy; Cloudflare still builds the site).
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Asset hashes match (set_version.py)
        run: python3 tests/check_assets.py
      - name: Edge worker
        run: |
          node tests/worker_test.mjs
          node tests/worker_links_test.mjs
      - name: Dose rules and texts
        run: |
          node tests/abrules_test.mjs
          node tests/data_check.cjs
          node tests/i18n_check.mjs
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Visitors and owner on phone, iPad and computer
        run: node tests/e2e_flow.cjs
